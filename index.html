<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CarDash">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>CarDash</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    :root {
      --gap: 10px;
      --radius: 20px;
      --sb-w: 124px;
      --rp-w: 320px;
      --accent: #0a84ff;
      --text: #ffffff;
      --text2: rgba(255,255,255,.6);
      --text3: rgba(255,255,255,.3);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      /* Background wallpaper visible in gaps */
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--text);
    }

    /* ═══════════════════════════════════
       LANDSCAPE — 3-column CarPlay grid
    ═══════════════════════════════════ */
    #app {
      height: 100dvh;
      padding: var(--gap);
      padding-top: max(var(--gap), env(safe-area-inset-top, 0px));
      padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
      display: grid;
      grid-template-columns: var(--sb-w) 1fr var(--rp-w);
      grid-template-rows: 1fr;
      gap: var(--gap);
    }

    /* ═══════════════════════════════════
       SIDEBAR
    ═══════════════════════════════════ */
    #sidebar {
      background: rgba(10,10,10,.95);
      border-radius: var(--radius);
      backdrop-filter: blur(30px) saturate(160%);
      -webkit-backdrop-filter: blur(30px) saturate(160%);
      border: 1px solid rgba(255,255,255,.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0 12px;
      gap: 0;
    }

    .sb-time {
      font-size: 22px; font-weight: 600;
      letter-spacing: -1px; line-height: 1;
      margin-bottom: 4px;
    }

    .sb-conn {
      margin-bottom: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .sb-conn svg { width: 20px; height: 20px; }
    .sb-conn-label {
      font-size: 9px; font-weight: 600; letter-spacing: .4px;
      color: rgba(255,255,255,.6);
    }
    .sb-conn.offline svg { opacity: .3; }
    .sb-conn.offline .sb-conn-label { color: rgba(255,255,255,.3); }

    .sb-apps {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
    }

    .app-icon {
      width: 56px; height: 56px; border-radius: 16px;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .12s, box-shadow .2s;
      position: relative;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }
    .app-icon:active { transform: scale(.90); }

    /* Active indicator — blue bar on left side */
    .app-icon.active::before {
      content: '';
      position: absolute; left: -18px; top: 50%;
      transform: translateY(-50%);
      width: 4px; height: 38px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }

    .icon-maps, .icon-music, .icon-phone { background: none; }

    .app-icon { overflow: hidden; }
    .app-icon svg.full-icon { width: 100%; height: 100%; display: block; }
    .icon-music svg.full-icon { transform: scale(1.2); }
    .app-icon svg.glyph { width: 32px; height: 32px; fill: white; }

    .sb-grid {
      display: none;
      width: 52px; height: 52px;
      border-radius: 14px;
      background: rgba(255,255,255,.1);
      border: none; cursor: pointer;
      grid-template-columns: repeat(3, 9px);
      grid-template-rows: repeat(3, 9px);
      gap: 3px; padding: 10px;
      align-items: center; justify-items: center;
      transition: transform .1s;
    }
    .sb-grid:active { transform: scale(.9); }
    .sb-grid span {
      width: 9px; height: 9px;
      background: rgba(255,255,255,.65);
      border-radius: 2.5px;
      display: block;
    }

    /* ═══════════════════════════════════
       MAP CENTER
    ═══════════════════════════════════ */
    #map-area {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.06);
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }

    #leaflet-map { position: absolute; inset: 0; }

    .leaflet-control-zoom,
    .leaflet-control-attribution { display: none !important; }

    /* Map overlay buttons */
    .mb {
      position: absolute; z-index: 1000;
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(20,20,20,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.14);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 20px;
      transition: transform .1s;
      box-shadow: 0 3px 10px rgba(0,0,0,.35);
    }
    .mb:active { transform: scale(.90); }
    .mb svg { fill: rgba(255,255,255,.88); }

    .mb-search  { top: 14px; left: 14px; font-size: 18px; }
    .mb-compass { top: 14px; right: 14px; flex-direction: column; gap: 1px; }
    .mb-type    { bottom: 66px; right: 14px; }
    .mb-expand  { bottom: 10px; right: 14px; }

    /* Speed badge */
    .map-speed {
      position: absolute; bottom: 10px; left: 14px;
      z-index: 1000;
      background: rgba(12,12,12,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px; padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.1);
      text-align: center;
    }
    .map-speed-val { font-size: 26px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
    .map-speed-unit { font-size: 11px; color: var(--text2); font-weight: 400; }

    /* ═══════════════════════════════════
       RIGHT PANEL
    ═══════════════════════════════════ */
    #right-panel {
      display: flex; flex-direction: column;
      gap: var(--gap);
    }

    /* — NOW PLAYING card — */
    .np-card {
      flex: 3;
      border-radius: var(--radius);
      background: rgba(18,18,18,.95);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255,255,255,.16);
      padding: 12px 14px 10px;
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
      cursor: pointer;
      overflow: hidden;
      transition: opacity .15s;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }
    .np-card:active { opacity: .85; }

    /* Inner shine */
    .np-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
    }

    .np-art {
      width: 64px; height: 64px; border-radius: 12px;
      background: rgba(140,150,180,.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      margin-bottom: 6px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }
    .np-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
    .np-art.playing { animation: art-pulse 3s ease infinite; }
    @keyframes art-pulse {
      0%,100% { box-shadow: 0 4px 16px rgba(0,0,0,.3); }
      50%      { box-shadow: 0 6px 24px rgba(10,132,255,.3), 0 4px 16px rgba(0,0,0,.2); }
    }

    .np-title  { font-size: 15px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 1px; text-align: center; }
    .np-artist { font-size: 12px; color: var(--text2); text-align: center; margin-bottom: 5px; }

    /* Progress in card */
    .np-prog-bar {
      width: 100%; height: 3px;
      background: rgba(255,255,255,.18);
      border-radius: 2px; cursor: pointer;
      margin-bottom: 5px; overflow: hidden;
    }
    .np-prog-fill {
      height: 100%; width: 0%;
      background: rgba(255,255,255,.8);
      border-radius: 2px;
      transition: width .4s linear;
    }

    /* Controls in card */
    .np-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 18px; width: 100%;
    }
    .np-btn {
      background: none; border: none; color: var(--text);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform .1s, opacity .15s;
    }
    .np-btn:active { transform: scale(.85); opacity: .7; }
    .np-btn svg { fill: currentColor; }
    .np-btn.sm svg { width: 24px; height: 24px; }

    .np-play {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,.18);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .12s, background .15s;
    }
    .np-play:active { transform: scale(.90); background: rgba(255,255,255,.28); }
    .np-play svg { width: 24px; height: 24px; fill: white; }

    /* — DATE / WEATHER card — */
    .dw-card {
      flex: 2;
      border-radius: var(--radius);
      background: rgba(10,10,10,.95);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255,255,255,.11);
      padding: 10px 16px 10px;
      display: flex; flex-direction: column; justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }

    .dw-date { font-size: 15px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 8px; }

    .dw-main-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }

    .dw-icon-wrap {
      width: 46px; height: 46px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .dw-icon-wrap svg { width: 100%; height: 100%; }

    .dw-temp-col { display: flex; flex-direction: column; gap: 1px; }
    .dw-temp { font-size: 36px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
    .dw-cond { font-size: 12px; color: var(--text2); margin-top: 2px; }

    .dw-loc   { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); margin-bottom: 2px; }
    .dw-src   { font-size: 10px; color: var(--text3); }

    /* ═══════════════════════════════════
       MUSIC OVERLAY  (slides up)
    ═══════════════════════════════════ */
    #overlay {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none;
      transition: opacity .28s ease;
      display: flex; align-items: flex-end;
    }
    #overlay.show { opacity: 1; pointer-events: all; }

    .overlay-sheet {
      width: 100%; max-width: 600px; margin: 0 auto;
      background: #0d0d0d;
      border-radius: 24px 24px 0 0;
      padding: 0 22px 22px;
      padding-bottom: max(22px, var(--safe-b));
      transform: translateY(100%);
      transition: transform .32s cubic-bezier(.4,0,.2,1);
      border: 1px solid rgba(255,255,255,.1);
      border-bottom: none;
    }
    #overlay.show .overlay-sheet { transform: translateY(0); }

    .os-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,.2); border-radius: 2px;
      margin: 12px auto 18px;
    }

    .os-art {
      width: min(180px, 44vw); height: min(180px, 44vw);
      border-radius: 18px;
      background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 64px;
      margin: 0 auto 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      overflow: hidden;
    }
    .os-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 18px; }
    .os-art.playing { box-shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 0 2px rgba(10,132,255,.4); }

    .os-info { text-align: center; margin-bottom: 16px; }
    .os-title  { font-size: 21px; font-weight: 700; letter-spacing: -.4px; }
    .os-artist { font-size: 15px; color: var(--text2); margin-top: 4px; }

    /* Overlay progress */
    .os-prog-wrap { margin-bottom: 16px; }
    .os-prog-bar { height: 4px; background: rgba(255,255,255,.14); border-radius: 2px; cursor: pointer; }
    .os-prog-fill {
      height: 100%; width: 0%; background: white; border-radius: 2px;
      transition: width .4s linear;
    }
    .os-prog-times {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--text2); margin-top: 5px;
    }

    /* Overlay controls */
    .os-controls {
      display: flex; align-items: center;
      justify-content: center; gap: 28px; margin-bottom: 18px;
    }
    .os-skip { background: none; border: none; color: var(--text); cursor: pointer; opacity: .85; transition: transform .1s; }
    .os-skip:active { transform: scale(.85); }
    .os-skip svg { width: 30px; height: 30px; fill: currentColor; }
    .os-play-btn {
      width: 68px; height: 68px; border-radius: 50%;
      background: white; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(255,255,255,.15);
      transition: transform .12s;
    }
    .os-play-btn:active { transform: scale(.90); }
    .os-play-btn svg { width: 30px; height: 30px; fill: black; }

    /* Volume */
    .os-vol { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .os-vol-ic { font-size: 16px; color: var(--text2); }
    input[type=range] {
      flex: 1; -webkit-appearance: none;
      height: 3px; background: rgba(255,255,255,.15);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px;
      background: #fff; border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }

    /* Bottom actions */
    .os-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .os-action-btn {
      border-radius: 13px; padding: 13px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .15s;
    }
    .os-action-btn:active { opacity: .7; }
    .btn-amz { background: #111111; color: #ff9900; }
    .btn-file { background: rgba(255,255,255,.08); color: white; }

    audio { display: none; }

    /* ═══════════════════════════════════
       PORTRAIT FALLBACK
    ═══════════════════════════════════ */
    @media (orientation: portrait) {
      :root { --sb-w: auto; --rp-w: auto; }
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        padding: 0; gap: 0;
      }
      #sidebar {
        flex-direction: row; border-radius: 0;
        padding:
          max(14px, env(safe-area-inset-top, 14px))
          max(16px, env(safe-area-inset-right, 16px))
          12px
          max(16px, env(safe-area-inset-left, 16px));
        border: none; border-bottom: 1px solid rgba(255,255,255,.08);
        align-items: flex-end;
        box-shadow: 0 2px 12px rgba(0,0,0,.3);
      }
      .sb-conn { display: none; }
      .sb-time { font-size: 17px; margin: 0 12px 0 0; }
      .sb-apps { flex-direction: row; gap: 12px; flex: unset; justify-content: center; }
      .app-icon { width: 40px; height: 40px; border-radius: 11px; box-shadow: none; }
      .app-icon svg { width: 22px; height: 22px; }
      .app-icon.active::before {
        left: 50%; top: auto; bottom: -9px;
        transform: translateX(-50%);
        width: 22px; height: 3px; border-radius: 2px;
      }
      #map-area { border-radius: 0; border: none; }
      #right-panel {
        flex-direction: row;
        padding:
          8px
          max(8px, env(safe-area-inset-right, 8px))
          max(8px, env(safe-area-inset-bottom, 8px))
          max(8px, env(safe-area-inset-left, 8px));
        gap: 8px;
        border-top: 1px solid rgba(255,255,255,.07);
        background: rgba(0,0,0,.98);
      }
      .np-card  { flex: 1; border-radius: 14px; padding: 10px 12px 8px; min-width: 0; }
      .np-art   { width: 44px; height: 44px; border-radius: 8px; font-size: 22px; margin-bottom: 6px; }
      .np-title  { font-size: 13px; }
      .np-artist { font-size: 11px; margin-bottom: 6px; }
      .np-controls { gap: 14px; }
      .np-play  { width: 36px; height: 36px; }
      .np-play svg { width: 17px; height: 17px; }
      .np-btn.sm svg { width: 18px; height: 18px; }
      .np-prog-bar { margin-bottom: 6px; }
      .dw-card      { flex: 1; border-radius: 14px; padding: 10px 12px; }
      .dw-date      { font-size: 13px; margin-bottom: 6px; }
      .dw-main-row  { gap: 8px; margin-bottom: 4px; }
      .dw-icon-wrap { width: 36px; height: 36px; }
      .dw-temp      { font-size: 26px; }
      .dw-cond      { font-size: 11px; }
      .dw-loc       { font-size: 10px; }
      .dw-src       { display: none; }
    }

    /* ═══════════════════════════════════
       ROUTE OVERLAY
    ═══════════════════════════════════ */
    #route-overlay {
      position: fixed; inset: 0; z-index: 1002;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none;
      transition: opacity .28s ease;
      display: flex; align-items: flex-end;
    }
    #route-overlay.show { opacity: 1; pointer-events: all; }

    .route-sheet {
      width: 100%; max-width: 640px; margin: 0 auto;
      background: #0d0d0d;
      border-radius: 24px 24px 0 0;
      padding: 0 16px;
      padding-bottom: max(22px, var(--safe-b));
      transform: translateY(100%);
      transition: transform .32s cubic-bezier(.4,0,.2,1);
      border: 1px solid rgba(255,255,255,.1); border-bottom: none;
      max-height: 72vh; display: flex; flex-direction: column; overflow: hidden;
    }
    #route-overlay.show .route-sheet { transform: translateY(0); }

    .route-sheet-title {
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,.45);
      text-align: center; padding: 14px 0 8px; letter-spacing: .2px;
    }

    .route-search-bar {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.09);
      border-radius: 14px; padding: 10px 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,.1);
    }
    .route-search-bar svg { flex-shrink: 0; }
    #route-input {
      flex: 1; background: none; border: none; outline: none;
      color: white; font-size: 17px; font-family: inherit;
    }
    #route-input::placeholder { color: rgba(255,255,255,.35); }
    #route-clear-btn {
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(255,255,255,.22); border: none; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      flex-shrink: 0; color: rgba(0,0,0,.8); font-size: 10px;
      font-weight: 700; line-height: 1;
    }
    #route-clear-btn.visible { display: flex; }

    .route-section-label {
      font-size: 11px; font-weight: 700; letter-spacing: .5px;
      color: rgba(255,255,255,.35); text-transform: uppercase;
      margin: 4px 0 8px 2px;
    }

    #route-results { flex: 1; overflow-y: auto; }

    .route-result-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 4px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,.06);
      border-radius: 8px;
      transition: background .12s;
    }
    .route-result-item:active { background: rgba(255,255,255,.06); }
    .route-result-item:last-child { border-bottom: none; }

    .rr-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .rr-icon svg { width: 18px; height: 18px; fill: rgba(255,255,255,.65); }

    .rr-text { flex: 1; min-width: 0; }
    .rr-name {
      font-size: 15px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rr-addr {
      font-size: 12px; color: rgba(255,255,255,.4); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .route-hint {
      text-align: center; padding: 28px 16px;
      color: rgba(255,255,255,.35); font-size: 14px; line-height: 1.5;
    }

    /* Route info banner (on map, below top buttons) */
    #route-banner {
      position: absolute;
      top: 74px; left: 14px; right: 14px;
      z-index: 1001;
      background: rgba(12,12,12,.96);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 18px; padding: 10px 12px;
      display: flex; align-items: center; gap: 10px;
      transform: translateY(-10px); opacity: 0;
      transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
      pointer-events: none;
    }
    #route-banner.show { transform: translateY(0); opacity: 1; pointer-events: all; }
    .rb-info { flex: 1; min-width: 0; }
    .rb-dest {
      font-size: 13px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

      border: none; cursor: pointer; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 5px;
      transition: opacity .15s; white-space: nowrap;

    .rb-close { background: rgba(255,255,255,.12); color: rgba(255,255,255,.8); padding: 0 9px; }

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ═══════════════════════════════════
   CLOCK / DATE
═══════════════════════════════════ */
const DAYS   = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function tick() {
  const n = new Date();
  const hh = String(n.getHours()).padStart(2,'0');
  const mm = String(n.getMinutes()).padStart(2,'0');
  document.getElementById('sb-time').textContent = `${hh}:${mm}`;

  // Date card — match "Monday, 10. Aug 2026" style
  const day = DAYS[n.getDay()];
  const date = `${day}, ${n.getDate()}. ${MONTHS_SHORT[n.getMonth()]} ${n.getFullYear()}`;
  document.getElementById('dw-date').textContent = date;
}
setInterval(tick, 1000);
tick();

/* ═══════════════════════════════════

═══════════════════════════════════ */

  2:'Teilw. bewölkt',   3:'Bewölkt',
  45:'Nebel',           48:'Gefrierender Nebel',
  51:'Leichter Niesel', 53:'Nieselregen',       55:'Starker Niesel',
  61:'Leichter Regen',  63:'Regen',             65:'Starker Regen',
  71:'Leichter Schnee', 73:'Schnee',            75:'Starker Schnee',
  77:'Schneegriesel',
  80:'Leichte Schauer', 81:'Schauer',           82:'Heftige Schauer',
  85:'Schneeschauer',   86:'Starke Schneeschauer',
  95:'Gewitter',        96:'Gewitter + Hagel',  99:'Schweres Gewitter',

const _sw = 3.5; // ray stroke width
const WX_SVG = {
  sun: `<svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="30" r="11" fill="white"/>

    <line x1="3"  y1="30" x2="13" y2="30" stroke="white" stroke-width="${_sw}" stroke-linecap="round"/>
    <line x1="47" y1="30" x2="57" y2="30" stroke="white" stroke-width="${_sw}" stroke-linecap="round"/>
    <line x1="10.5" y1="10.5" x2="17.5" y2="17.5" stroke="white" stroke-width="${_sw}" stroke-linecap="round"/>
    <line x1="42.5" y1="42.5" x2="49.5" y2="49.5" stroke="white" stroke-width="${_sw}" stroke-linecap="round"/>

    <path d="M57 44H20C13.37 44 8 38.63 8 32C8 25.37 13.37 20 20 20C20.22 20 20.44 20 20.65 20.03C22.6 13.71 28.47 9 35.5 9C41.35 9 46.47 12.16 49.32 16.88C50.82 16.32 52.45 16 54.17 16C61.18 16 66.9 21.71 66.9 28.73C66.9 35.75 61.18 41.46 54.17 41.46" fill="white"/>
  </svg>`,

    <line x1="48" y1="50" x2="44" y2="62" stroke="rgba(150,210,255,.9)" stroke-width="3" stroke-linecap="round"/>

  snow: `<svg viewBox="0 0 70 68" fill="none" xmlns="http://www.w3.org/2000/svg">

  </svg>`,
  fog: `<svg viewBox="0 0 70 52" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="8"  y1="16" x2="62" y2="16" stroke="rgba(255,255,255,.65)" stroke-width="4" stroke-linecap="round"/>

    <path d="M38 42L28 56H37L30 68L50 50H39L46 42Z" fill="rgba(255,220,50,.95)"/>

function getWxIcon(code) {
  if (code === 0)            return WX_SVG.sun;
  if (code <= 2)             return WX_SVG.suncloud;
  if (code === 3)            return WX_SVG.partcloud;
  if (code <= 48)            return WX_SVG.fog;
  if (code <= 67)            return WX_SVG.rain;
  if (code <= 77)            return WX_SVG.snow;
  if (code <= 82)            return WX_SVG.rain;
  if (code <= 86)            return WX_SVG.snow;
  return WX_SVG.thunder;
}

let wxDone = false;
async function fetchWeather(lat, lon) {
  if (wxDone) return; wxDone = true;
  try {
    const [wRes, gRes] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&wind_speed_unit=kmh&timezone=auto`),
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=de`),
    ]);
    const w = await wRes.json(), g = await gRes.json();
    const c = w.current, code = c.weather_code;
    const cond = WMO_COND[code] || 'Unbekannt';
    const city  = g.address?.city || g.address?.town || g.address?.village || g.address?.county || '';
    const state = g.address?.state || '';
    const loc   = state ? `${city}, ${state}` : (city || 'Mein Standort');

    document.getElementById('dw-icon').innerHTML = getWxIcon(code);
    document.getElementById('dw-temp').textContent = `${Math.round(c.temperature_2m)}°C`;
    document.getElementById('dw-cond').textContent = cond;
    document.getElementById('dw-loc').textContent  = loc;
  } catch {
    document.getElementById('dw-cond').textContent = 'Keine Verbindung';
    document.getElementById('dw-icon').innerHTML = '';
  }
}

/* ═══════════════════════════════════
   MAP + GPS
═══════════════════════════════════ */
let map = null, marker = null, circle = null, following = true, lastGPS = null;

const CACHE_KEY = 'cardash_last_pos';

function savePos(lat, lon) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ lat, lon })); } catch {}
}
function loadPos() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; }
}

function initMap() {
  if (map) { map.invalidateSize(); return; }
  const cached = loadPos();
  const startView = cached ? [cached.lat, cached.lon] : [51.1657, 10.4515];
  const startZoom = cached ? 15 : 6;
  map = L.map('leaflet-map', { zoomControl:false, attributionControl:false })
         .setView(startView, startZoom);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 20,
  }).addTo(map);

  map.on('dragstart', () => setFollowing(false));
}

function setFollowing(state) {
  following = state;
  const btn = document.getElementById('compass-btn');
  btn.style.background = state ? 'rgba(0,122,255,.45)' : 'rgba(20,20,20,.92)';
  btn.style.borderColor = state ? 'rgba(0,122,255,.7)' : 'rgba(255,255,255,.14)';
}

function makeGpsIcon(heading) {
  const hasH = heading != null && !isNaN(heading);
  const arrow = hasH
    ? `<div style="position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;
         transform:rotate(${heading}deg);pointer-events:none">
         <div style="width:0;height:0;margin-top:-13px;
           border-left:5px solid transparent;border-right:5px solid transparent;
           border-bottom:13px solid white;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))"></div>
       </div>`
    : '';
  return L.divIcon({
    className: '',
    html: `<div style="position:relative;width:20px;height:20px">
      ${arrow}
      <div style="position:absolute;inset:0;background:#007aff;border-radius:50%;border:3px solid white;box-shadow:0 2px 10px rgba(0,0,0,.4)">
        <div style="position:absolute;inset:-6px;border-radius:50%;background:rgba(0,122,255,.15);animation:gps-ring 2s ease-out infinite"></div>
      </div>
    </div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10],
  });
}

document.getElementById('compass-btn').addEventListener('click', () => {
  setFollowing(true);
  if (lastGPS && map) {
    map.setView([lastGPS.lat, lastGPS.lon], Math.max(map.getZoom(), 15), { animate: true });
  }
});

let expanded = false;
function toggleExpand() {
  expanded = !expanded;
  const rp = document.getElementById('right-panel');
  const sb = document.getElementById('sidebar');
  rp.style.display = expanded ? 'none' : '';
  sb.style.display = expanded ? 'none' : '';
  document.getElementById('app').style.gridTemplateColumns = expanded
    ? '1fr' : 'var(--sb-w) 1fr var(--rp-w)';
  if (map) setTimeout(() => map.invalidateSize(), 50);
}

function startGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(onPos, onErr, {
    enableHighAccuracy: true, timeout: 30000, maximumAge: 0,
  });
}

function onPos(p) {
  const { latitude:lat, longitude:lon, accuracy, speed, heading } = p.coords;
  lastGPS = { lat, lon, heading };

  document.getElementById('m-speed').textContent =
    speed != null && speed > 1.4 ? Math.round(speed * 3.6) : '—';

  savePos(lat, lon);
  fetchWeather(lat, lon);
  if (!map) return;

  const ll = [lat, lon];
  const icon = makeGpsIcon(heading);

  if (!marker) {
    marker = L.marker(ll, { icon }).addTo(map);
    circle = L.circle(ll, { radius: accuracy, color: '#007aff', fillColor: '#007aff', fillOpacity: .07, weight: 1 }).addTo(map);
    setFollowing(true);
    map.setView(ll, 15, { animate: true });
  } else {
    marker.setIcon(icon);
    marker.setLatLng(ll);
    circle.setLatLng(ll);
    circle.setRadius(accuracy);
    if (following) map.setView(ll, Math.max(map.getZoom(), 15), { animate: true, duration: .6 });
  }
}

function onErr(e) {
  console.warn('GPS:', e.message);
  document.getElementById('m-speed').textContent = '—';
}

/* ═══════════════════════════════════
   SIDEBAR ICON STATE
═══════════════════════════════════ */
function setActiveIcon(id) {
  document.querySelectorAll('.app-icon').forEach(el => el.classList.remove('active'));
  document.getElementById(`icon-${id}`)?.classList.add('active');
}

/* ═══════════════════════════════════
   MUSIC PLAYER
═══════════════════════════════════ */
let audio    = document.getElementById('audio');
let playlist = [], trackIdx = 0, isPlaying = false;

function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

function syncUI(playing) {
  isPlaying = playing;
  const pause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  const play  = '<path d="M8 5v14l11-7z"/>';
  const svg   = playing ? pause : play;
  document.getElementById('np-play-icon').innerHTML = svg;
  document.getElementById('os-play-icon').innerHTML = svg;
  document.getElementById('np-art').classList.toggle('playing', playing);
  document.getElementById('os-art').classList.toggle('playing', playing);
}

function loadTrack(i) {
  const t = playlist[i];
  audio.src = t.url;
  const name = t.name, artist = t.artist || '';
  document.getElementById('np-title').textContent  = name;
  document.getElementById('os-title').textContent  = name;
  document.getElementById('np-artist').textContent = artist;
  document.getElementById('os-artist').textContent = artist;
  audio.play().then(()=>syncUI(true)).catch(()=>{});
}

function togglePlay() {
  if (!playlist.length) { openOverlay(); return; }
  if (isPlaying) { audio.pause(); syncUI(false); }
  else { audio.play().then(()=>syncUI(true)).catch(()=>{}); }
}

function prevTrack() {
  if (!playlist.length) return;
  trackIdx = (trackIdx - 1 + playlist.length) % playlist.length;
  loadTrack(trackIdx);
}
function nextTrack() {
  if (!playlist.length) return;
  trackIdx = (trackIdx + 1) % playlist.length;
  loadTrack(trackIdx);
}

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById('np-fill').style.width   = `${pct}%`;
  document.getElementById('os-fill').style.width   = `${pct}%`;
  document.getElementById('os-t-cur').textContent  = fmtTime(audio.currentTime);
  document.getElementById('os-t-tot').textContent  = fmtTime(audio.duration);
});

audio.addEventListener('ended', nextTrack);
audio.addEventListener('play',  () => syncUI(true));
audio.addEventListener('pause', () => syncUI(false));

// Progress bar clicks
['np-prog','os-prog'].forEach(id => {
  document.getElementById(id)?.addEventListener('click', e => {
    if (!audio.duration) return;
    const r = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  });
});

document.getElementById('vol').addEventListener('input', e => audio.volume = +e.target.value);

document.getElementById('file-in').addEventListener('change', e => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  playlist = files.map(f => ({
    url: URL.createObjectURL(f),
    name: f.name.replace(/\.[^.]+$/, ''),
    artist: '',
  }));
  trackIdx = 0;
  loadTrack(0);
});

/* ═══════════════════════════════════
   NOW PLAYING (Last.fm / Scrubbler)
═══════════════════════════════════ */
const LASTFM_API_KEY     = 'bf4f954710cb7eaaa2038208abbd9cb5';
const LASTFM_USER        = 'jesshorsch';
const LASTFM_PLACEHOLDER = '2a96cbd8b46e442fc41c2b86b821562f';

let npTimer = null, lastNpKey = '';

function npSetIdle() {
  document.getElementById('np-title').textContent  = 'Nichts läuft';
  document.getElementById('np-artist').textContent = '';
  document.getElementById('np-art').innerHTML = '🎵';
  document.getElementById('np-art').classList.remove('playing');
  document.getElementById('os-title').textContent  = 'Kein Titel';
  document.getElementById('os-artist').textContent = 'Unbekannter Künstler';
  document.getElementById('os-art').innerHTML = '🎵';
  document.getElementById('os-art').classList.remove('playing');
  lastNpKey = '';
}

function npCardClick() { openOverlay(); }

async function pollNowPlaying() {
  try {
    const res = await fetch(
      `https://ws.audioscrobbler.com/2.0/?method=user.getRecentTracks&user=${LASTFM_USER}&api_key=${LASTFM_API_KEY}&format=json&limit=1`
    );
    const d = await res.json();
    const track = d?.recenttracks?.track?.[0];
    if (!track) { npSetIdle(); return; }
    const isNowPlaying = track['@attr']?.nowplaying === 'true';
    const ageSec = track.date?.uts ? (Date.now() / 1000 - Number(track.date.uts)) : Infinity;
    if (!isNowPlaying && ageSec > 240) { npSetIdle(); return; }

    const title  = track.name;
    const artist = track.artist['#text'];

    document.getElementById('np-title').textContent  = title;
    document.getElementById('np-artist').textContent = artist;
    document.getElementById('np-art').classList.add('playing');
    document.getElementById('os-title').textContent  = title;
    document.getElementById('os-artist').textContent = artist;
    document.getElementById('os-art').classList.add('playing');

    const key = `${artist}|${title}`;
    if (key !== lastNpKey) {
      lastNpKey = key;
      const imgUrl = track.image?.slice().reverse()
        .find(i => i['#text'] && !i['#text'].includes(LASTFM_PLACEHOLDER))?.['#text'] || '';
      const html = imgUrl ? `<img src="${imgUrl}" alt="">` : '🎵';
      document.getElementById('np-art').innerHTML = html;
      document.getElementById('os-art').innerHTML = html;
      document.getElementById('np-art').classList.add('playing');
      document.getElementById('os-art').classList.add('playing');
    }
  } catch (_) { /* silent */ }
}

function startNpPolling() {
  pollNowPlaying();
  npTimer = setInterval(pollNowPlaying, 15000);
}

/* ═══════════════════════════════════
   MUSIC OVERLAY
═══════════════════════════════════ */
function openOverlay() {
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
  setActiveIcon('map');
}

/* ═══════════════════════════════════
   BOOT
═══════════════════════════════════ */
function updateConn() {
  const el    = document.getElementById('sb-conn');
  const label = document.getElementById('sb-conn-label');
  if (navigator.onLine) {
    el.classList.remove('offline');
    label.textContent = 'ONLINE';
  } else {
    el.classList.add('offline');
    label.textContent = 'OFFLINE';
  }
}
window.addEventListener('online',  updateConn);
window.addEventListener('offline', updateConn);
updateConn();

initMap();
setFollowing(true);
startGPS();

startNpPolling();

// Add CSS for GPS ring animation
const style = document.createElement('style');
style.textContent = '@keyframes gps-ring { 0% { opacity:.6; transform:scale(1); } 100% { opacity:0; transform:scale(2.5); } }';
document.head.appendChild(style);

/* ═══════════════════════════════════
   ROUTE SEARCH & NAVIGATION
═══════════════════════════════════ */
let routeLine = null, destMarker = null, activeDest = null;
let _searchTimer = null, _searchResults = [];
const RECENT_KEY = 'cardash_route_recent';

// ── Overlay open/close ──
function openRouteOverlay() {
  renderRouteResults();
  document.getElementById('route-overlay').classList.add('show');
  setTimeout(() => document.getElementById('route-input').focus(), 340);
}
function closeRouteOverlay() {
  document.getElementById('route-overlay').classList.remove('show');
  document.getElementById('route-input').value = '';
  document.getElementById('route-clear-btn').classList.remove('visible');
}
function clearRouteInput() {
  document.getElementById('route-input').value = '';
  document.getElementById('route-clear-btn').classList.remove('visible');
  renderRouteResults();
  document.getElementById('route-input').focus();
}

// ── Search input handler ──
document.getElementById('route-input').addEventListener('input', e => {
  const q = e.target.value.trim();
  document.getElementById('route-clear-btn').classList.toggle('visible', q.length > 0);
  clearTimeout(_searchTimer);
  if (q.length < 2) { renderRouteResults(); return; }
  document.getElementById('route-results').innerHTML = '<div class="route-hint">Suche…</div>';
  _searchTimer = setTimeout(() => fetchPlaces(q), 320);
});

async function fetchPlaces(query) {
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=6&accept-language=de&addressdetails=1`;
    const res  = await fetch(url);
    _searchResults = await res.json();
    renderSearchResults(_searchResults);
  } catch {
    document.getElementById('route-results').innerHTML = '<div class="route-hint">Suche nicht verfügbar</div>';
  }
}

function renderSearchResults(results) {
  const el = document.getElementById('route-results');
  if (!results.length) { el.innerHTML = '<div class="route-hint">Keine Ergebnisse</div>'; return; }
  el.innerHTML = '<div class="route-section-label">Ergebnisse</div>' +
    results.map((r, i) => {
      const name = r.name || r.display_name.split(',')[0];
      const addr = r.display_name.split(',').slice(1, 3).join(', ').trim();
      return `<div class="route-result-item" onclick="selectSearchResult(${i})">
        <div class="rr-icon">${pinSvg()}</div>
        <div class="rr-text">
          <div class="rr-name">${esc(name)}</div>
          <div class="rr-addr">${esc(addr)}</div>
        </div>
      </div>`;
    }).join('');
}

function renderRouteResults() {
  const el = document.getElementById('route-results');
  const recent = getRecent();
  if (!recent.length) {
    el.innerHTML = '<div class="route-hint">Gib einen Ort oder eine Adresse ein</div>';
    return;
  }
  el.innerHTML = '<div class="route-section-label">Zuletzt</div>' +
    recent.map((r, i) => `<div class="route-result-item" onclick="selectRecentResult(${i})">
      <div class="rr-icon">${clockSvg()}</div>
      <div class="rr-text">
        <div class="rr-name">${esc(r.name)}</div>
        <div class="rr-addr">${esc(r.addr)}</div>
      </div>
    </div>`).join('');
}

function selectSearchResult(i) {
  const r = _searchResults[i];
  if (!r) return;
  const name = r.name || r.display_name.split(',')[0];
  const addr = r.display_name.split(',').slice(1, 3).join(', ').trim();
  const dest = { name, addr, lat: parseFloat(r.lat), lon: parseFloat(r.lon) };
  saveRecent(dest);
  startNavigation(dest);
}
function selectRecentResult(i) {
  const r = getRecent()[i];
  if (r) startNavigation(r);
}

// ── Navigation ──
function startNavigation(dest) {
  activeDest = dest;
  closeRouteOverlay();

  document.getElementById('rb-dest').textContent = dest.name;
  document.getElementById('rb-meta').textContent  = 'Route wird berechnet…';
  document.getElementById('route-banner').classList.add('show');

  placeDest(dest.lat, dest.lon);

  if (lastGPS) {
    calcRoute(lastGPS.lat, lastGPS.lon, dest.lat, dest.lon);
  } else {
    document.getElementById('rb-meta').textContent = 'Warte auf GPS…';
    navigator.geolocation?.getCurrentPosition(
      p => calcRoute(p.coords.latitude, p.coords.longitude, dest.lat, dest.lon),
      () => { document.getElementById('rb-meta').textContent = 'GPS nicht verfügbar'; }
    );
  }

  if (map) {
    const pts = [[dest.lat, dest.lon]];
    if (lastGPS) pts.push([lastGPS.lat, lastGPS.lon]);
    map.fitBounds(L.latLngBounds(pts), { padding: [70, 70] });
    setFollowing(false);
  }
}

async function calcRoute(fromLat, fromLon, toLat, toLon) {
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${fromLon},${fromLat};${toLon},${toLat}?overview=full&geometries=geojson`;
    const res  = await fetch(url);
    const data = await res.json();
    if (!data.routes?.length) throw new Error('no route');

    const route = data.routes[0];
    drawRoute(route.geometry.coordinates);

    const km   = (route.distance / 1000).toFixed(route.distance < 10000 ? 1 : 0);
    const dist = route.distance < 1000 ? `${Math.round(route.distance)} m` : `${km} km`;
    const mins = Math.round(route.duration / 60);
    const eta  = mins < 60 ? `${mins} Min.` : `${Math.floor(mins / 60)} Std. ${mins % 60} Min.`;
    document.getElementById('rb-meta').textContent = `${eta}  ·  ${dist}`;
  } catch {
    document.getElementById('rb-meta').textContent = 'Route nicht verfügbar';
  }
}

function drawRoute(coords) {
  if (!map) return;
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  const latlngs = coords.map(([lon, lat]) => [lat, lon]);
  routeLine = L.polyline(latlngs, {
    color: '#007aff', weight: 5, opacity: .88,
    lineJoin: 'round', lineCap: 'round',
  }).addTo(map);
}

function placeDest(lat, lon) {
  if (!map) return;
  if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
  const icon = L.divIcon({
    className: '',
    html: `<svg width="26" height="34" viewBox="0 0 26 34" fill="none" xmlns="http://www.w3.org/2000/svg"
        style="filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))">
      <path d="M13 0C5.82 0 0 5.82 0 13c0 9.1 13 21 13 21s13-11.9 13-21C26 5.82 20.18 0 13 0z" fill="#ff3b30"/>
      <circle cx="13" cy="13" r="5" fill="white"/>
    </svg>`,
    iconSize: [26, 34], iconAnchor: [13, 34],
  });
  destMarker = L.marker([lat, lon], { icon }).addTo(map);
}

function clearRoute() {
  if (routeLine)  { map?.removeLayer(routeLine);  routeLine  = null; }
  if (destMarker) { map?.removeLayer(destMarker); destMarker = null; }
  activeDest = null;
  document.getElementById('route-banner').classList.remove('show');
  setFollowing(true);
  if (lastGPS && map) map.setView([lastGPS.lat, lastGPS.lon], Math.max(map.getZoom(), 15), { animate: true });
}

function openInAppleMaps() {
  if (!activeDest) return;
  const { lat, lon } = activeDest;
  let url = `maps://maps.apple.com/?daddr=${lat},${lon}&dirflg=d`;
  if (lastGPS) url += `&saddr=${lastGPS.lat},${lastGPS.lon}`;
  window.location.href = url;
}

// ── Recent routes ──
function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
}
function saveRecent(dest) {
  let list = getRecent().filter(r => r.name !== dest.name);
  list.unshift(dest);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5))); } catch {}
}

// ── Helpers ──
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function pinSvg() {
  return `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;
}
function clockSvg() {
  return `<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>`;
}
</script>
